name: CI - Build, Lint, and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancel in-progress runs for the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Setup and validate workspace
  setup:
    name: Setup and Validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Verify npm workspaces configuration
        run: |
          echo "Checking npm workspaces..."
          npm --version
          node --version
          cat package.json | grep -A 15 "workspaces"
      
      - name: Install dependencies (all workspaces)
        run: npm install --if-present
      
      - name: Build shared library
        run: npm run build --workspace=shared
      
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            */node_modules
            shared/dist
          key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-

  # Job 2: Lint all TypeScript workspaces
  lint:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    needs: setup
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            */node_modules
            shared/dist
          key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}
      
      - name: Install dependencies
        run: npm install --if-present
      
      - name: Build shared library
        run: npm run build --workspace=shared
      
      - name: Run ESLint on all workspaces
        run: npm run lint --workspaces --if-present

  # Job 3: Type check all TypeScript workspaces
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    needs: setup
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            */node_modules
            shared/dist
          key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}
      
      - name: Install dependencies
        run: npm install --if-present
      
      - name: Build shared library
        run: npm run build --workspace=shared
      
      - name: Run TypeScript type check
        run: npm run typecheck --workspaces --if-present

  # Job 4: Test all workspaces
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: setup
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            */node_modules
            shared/dist
          key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}
      
      - name: Install dependencies
        run: npm install --if-present
      
      - name: Build shared library
        run: npm run build --workspace=shared
      
      - name: Run tests on all workspaces
        run: npm run test --workspaces --if-present

  # Job 5: Build all workspaces
  build:
    name: Build All Services
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    
    strategy:
      matrix:
        workspace:
          - frontend
          - backend
          - gateway
          - orchestrator
          - graph-engine
          - ai-router
          - shared
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --if-present
      
      - name: Build shared library first
        if: matrix.workspace != 'shared'
        run: npm run build --workspace=shared
      
      - name: Build workspace
        run: npm run build --workspace=${{ matrix.workspace }} --if-present
      
      - name: Upload build artifacts
        if: matrix.workspace == 'frontend' || matrix.workspace == 'shared'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.workspace }}
          path: ${{ matrix.workspace }}/dist
          retention-days: 7

  # Job 6: Python services validation
  python-services:
    name: Validate Python Services
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service:
          - agents
          - workers
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '${{ matrix.service }}/requirements.txt'
      
      - name: Install Python dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Lint Python code
        working-directory: ${{ matrix.service }}
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
      
      - name: Check Python syntax
        working-directory: ${{ matrix.service }}
        run: |
          python -m py_compile *.py || true

  # Job 7: Docker build validation
  docker-build:
    name: Validate Docker Builds
    runs-on: ubuntu-latest
    needs: [build, python-services]
    
    strategy:
      matrix:
        service:
          - frontend
          - backend
          - gateway
          - orchestrator
          - graph-engine
          - ai-router
          - workers
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: cyberintel-${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 8: Final validation
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, python-services, docker-build]
    if: always()
    
    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.python-services.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully!"
