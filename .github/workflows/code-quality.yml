name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Prettier formatting check
  prettier:
    name: Check Code Formatting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Check formatting
        run: npm run format:check

  # Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate || true
      
      - name: Check for known vulnerabilities
        run: |
          npm audit --json > audit-report.json || true
          cat audit-report.json
      
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 30

  # Dependency check
  dependency-check:
    name: Check Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Check for outdated dependencies
        run: npm outdated || true
      
      - name: Verify workspace dependencies
        run: |
          echo "Checking workspace dependencies..."
          npm ls --workspaces || true

  # License compliance
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Check licenses
        run: |
          npx license-checker --summary || true

  # Code complexity analysis
  complexity:
    name: Code Complexity Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Analyze code complexity
        run: |
          echo "Code complexity analysis..."
          find . -name "*.ts" -not -path "*/node_modules/*" -not -path "*/dist/*" | wc -l
          echo "TypeScript files found"

  # Documentation check
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check README files
        run: |
          echo "Checking for README files..."
          find . -maxdepth 2 -name "README*.md" -type f
      
      - name: Check documentation completeness
        run: |
          echo "Checking documentation..."
          [ -f "README.md" ] && echo "✓ Root README exists"
          [ -f "CONTRIBUTING.md" ] && echo "✓ CONTRIBUTING exists"
          [ -f "LICENSE" ] && echo "✓ LICENSE exists"
          [ -d "docs" ] && echo "✓ docs/ directory exists"

  # Success indicator
  quality-success:
    name: Code Quality Success
    runs-on: ubuntu-latest
    needs: [prettier, security-audit, dependency-check, license-check, complexity, docs-check]
    if: always()
    
    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.prettier.result }}" != "success" ]; then
            echo "Code formatting check failed"
            exit 1
          fi
          echo "All code quality checks passed!"
