name: Docker Build and Push

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/cyberintel

jobs:
  # Build and push Docker images for all services
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend
          - backend
          - gateway
          - orchestrator
          - graph-engine
          - ai-router
          - workers
          - telegram-bot
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
      
      - name: Image digest
        run: echo ${{ steps.meta.outputs.digest }}

  # Validate docker-compose configuration
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate docker-compose.yml
        run: docker compose config > /dev/null
      
      - name: Validate docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml config > /dev/null || echo "Production compose not found or invalid"
      
      - name: Check for security issues
        run: |
          echo "Checking for exposed secrets..."
          ! grep -r "password.*=" docker-compose*.yml | grep -v "POSTGRES_PASSWORD" | grep -v "NEO4J" || echo "Warning: Potential secrets found"

  # Test docker-compose startup
  test-compose:
    name: Test Docker Compose Startup
    runs-on: ubuntu-latest
    needs: validate-compose
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create .env file
        run: |
          cat > .env << EOF
          JWT_SECRET=test-secret-for-ci
          OPENAI_API_KEY=test-key
          ANTHROPIC_API_KEY=test-key
          OPENROUTER_API_KEY=test-key
          GROQ_API_KEY=test-key
          TELEGRAM_BOT_TOKEN=test-token
          EOF
      
      - name: Start core services
        run: |
          docker compose up -d postgres redis
          sleep 10
      
      - name: Check services health
        run: |
          docker compose ps
          docker compose logs postgres
          docker compose logs redis
      
      - name: Cleanup
        if: always()
        run: docker compose down -v

  # Success indicator
  docker-success:
    name: Docker CI Success
    runs-on: ubuntu-latest
    needs: [build-and-push, validate-compose, test-compose]
    if: always()
    
    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.build-and-push.result }}" != "success" ] || \
             [ "${{ needs.validate-compose.result }}" != "success" ] || \
             [ "${{ needs.test-compose.result }}" != "success" ]; then
            echo "One or more Docker jobs failed"
            exit 1
          fi
          echo "All Docker jobs passed successfully!"
