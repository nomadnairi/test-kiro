version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: cyberintel
      POSTGRES_USER: cyberintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cyberintel

  neo4j:
    image: neo4j:5.18-community
    restart: always
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_heap_max__size: 4G
    volumes:
      - neo4j_data:/data
    networks:
      - cyberintel

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - cyberintel

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - cyberintel

  gateway:
    build: ./gateway
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://cyberintel:${POSTGRES_PASSWORD}@postgres:5432/cyberintel
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres
      - redis
    networks:
      - cyberintel

  backend:
    build: ./backend
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://cyberintel:${POSTGRES_PASSWORD}@postgres:5432/cyberintel
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      - postgres
      - neo4j
      - redis
    networks:
      - cyberintel

  orchestrator:
    build: ./orchestrator
    restart: always
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      - redis
    networks:
      - cyberintel

  ai-router:
    build: ./ai-router
    restart: always
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - redis
    networks:
      - cyberintel

  graph-engine:
    build: ./graph-engine
    restart: always
    environment:
      - NODE_ENV=production
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    depends_on:
      - neo4j
    networks:
      - cyberintel

  workers:
    build: ./workers
    restart: always
    deploy:
      replicas: 5
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - DATABASE_URL=postgresql://cyberintel:${POSTGRES_PASSWORD}@postgres:5432/cyberintel
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    depends_on:
      - redis
      - postgres
      - neo4j
    networks:
      - cyberintel

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:3000"
    environment:
      - VITE_API_URL=https://api.yourdomain.com
    networks:
      - cyberintel

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - gateway
      - frontend
    networks:
      - cyberintel

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  elasticsearch_data:

networks:
  cyberintel:
    driver: bridge
