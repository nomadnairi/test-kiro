# ============================================================================
# CYBERINTEL PLATFORM - DOCKER COMPOSE CONFIGURATION
# ============================================================================
# 
# This file supports TWO deployment modes:
#
# 1. FULL MODE (Default - Commented Out Heavy Services)
#    - All services enabled
#    - Local AI inference (Ollama)
#    - Full-text search (Elasticsearch)
#    - Requires: 8+ vCPU, 16+ GB RAM
#
# 2. LIGHTWEIGHT VPS MODE (Current Configuration)
#    - Heavy services disabled
#    - API-based AI only (OpenAI, Anthropic, etc.)
#    - Reduced Neo4j memory
#    - Requires: 2 vCPU, 4 GB RAM
#
# To switch modes: See LIGHTWEIGHT_MODE.md
# ============================================================================

services:
  # ============================================================================
  # CORE DATABASES - ALWAYS ENABLED
  # ============================================================================

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: cyberintel-postgres
    environment:
      POSTGRES_DB: cyberintel
      POSTGRES_USER: cyberintel
      POSTGRES_PASSWORD: cyberintel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberintel"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'          # Reduced from 2 for VPS mode
          memory: 512M       # Reduced from 2G for VPS mode
    networks:
      - cyberintel-network

  # Neo4j Graph Database - LIGHTWEIGHT MODE
  # Memory reduced from 3G to 512M for VPS deployment
  # Plugins disabled to save memory
  neo4j:
    image: neo4j:5.18-community
    container_name: cyberintel-neo4j
    environment:
      NEO4J_AUTH: neo4j/cyberintel
      # PLUGINS DISABLED FOR LIGHTWEIGHT MODE - Uncomment for full mode:
      # NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      # NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_memory_heap_max__size: 256M      # Reduced from 2G
      NEO4J_dbms_memory_pagecache_size: 128M      # Added for memory control
      NEO4J_dbms_memory_transaction_max__size: 64M # Added for memory control
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p cyberintel 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'          # Reduced from 2
          memory: 512M       # Reduced from 3G
    networks:
      - cyberintel-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: cyberintel-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru  # Reduced from 512mb
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'        # Reduced from 1
          memory: 256M       # Reduced from 512M
    networks:
      - cyberintel-network

  # ============================================================================
  # HEAVY SERVICES - DISABLED IN LIGHTWEIGHT VPS MODE
  # ============================================================================
  # 
  # These services are COMMENTED OUT to save resources on low-spec VPS.
  # Total RAM saved: ~10 GB
  # 
  # To enable FULL MODE:
  # 1. Uncomment the services below
  # 2. Update Backend dependencies to include elasticsearch
  # 3. Update AI Router dependencies to include ollama
  # 4. See LIGHTWEIGHT_MODE.md for detailed instructions
  # ============================================================================

  # # Elasticsearch - DISABLED IN LIGHTWEIGHT MODE
  # # RAM Usage: ~2 GB
  # # Purpose: Full-text search for entities and IOCs
  # # When to enable: When you need advanced search capabilities
  # # Alternative: Use PostgreSQL LIKE queries (slower but works)
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
  #   container_name: cyberintel-elasticsearch
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #     - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
  #   ports:
  #     - "9200:9200"
  #     - "9300:9300"
  #   volumes:
  #     - elasticsearch_data:/usr/share/elasticsearch/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '2'
  #         memory: 2G
  #   networks:
  #     - cyberintel-network

  # # Ollama (Local AI) - DISABLED IN LIGHTWEIGHT MODE
  # # RAM Usage: ~8 GB (with models loaded)
  # # Purpose: Local LLM inference (privacy, no API costs)
  # # When to enable: When you have GPU and want local AI
  # # Alternative: Use API-based providers (OpenAI, Anthropic, Groq)
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: cyberintel-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '4'
  #         memory: 8G
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   networks:
  #     - cyberintel-network

  # ============================================================================
  # CORE SERVICES - ALWAYS ENABLED
  # ============================================================================

  # API Gateway
  gateway:
    build:
      context: .              # Monorepo root
      dockerfile: gateway/Dockerfile
    container_name: cyberintel-gateway
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - PORT=8000
      - DATABASE_URL=postgresql://cyberintel:cyberintel@postgres:5432/cyberintel
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - CORS_ORIGIN=http://localhost:3000
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./gateway:/app
      - /app/node_modules
    command: npm run dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'          # Reduced from 2 for VPS mode
          memory: 512M       # Reduced from 1G for VPS mode
    networks:
      - cyberintel-network

  # Backend Service - LIGHTWEIGHT MODE
  # Elasticsearch dependency removed (commented out)
  backend:
    build:
      context: .              # Monorepo root
      dockerfile: backend/Dockerfile
    container_name: cyberintel-backend
    ports:
      - "8001:8001"
    environment:
      - NODE_ENV=development
      - PORT=8001
      - DATABASE_URL=postgresql://cyberintel:cyberintel@postgres:5432/cyberintel
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=cyberintel
      - REDIS_URL=redis://redis:6379
      # ELASTICSEARCH DISABLED IN LIGHTWEIGHT MODE:
      # - ELASTICSEARCH_URL=http://elasticsearch:9200
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      # ELASTICSEARCH DEPENDENCY REMOVED FOR LIGHTWEIGHT MODE:
      # elasticsearch:
      #   condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'          # Reduced from 2
          memory: 512M       # Reduced from 1G
    networks:
      - cyberintel-network

  # Orchestrator
  orchestrator:
    build:
      context: .              # Monorepo root
      dockerfile: orchestrator/Dockerfile
    container_name: cyberintel-orchestrator
    ports:
      - "8002:8002"
    environment:
      - NODE_ENV=development
      - PORT=8002
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://cyberintel:cyberintel@postgres:5432/cyberintel
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./orchestrator:/app
      - /app/node_modules
    command: npm run dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'        # Reduced from 1
          memory: 256M       # Reduced from 512M
    networks:
      - cyberintel-network

  # AI Router - LIGHTWEIGHT MODE
  # Ollama dependency removed (use API providers only)
  ai-router:
    build:
      context: .              # Monorepo root
      dockerfile: ai-router/Dockerfile
    container_name: cyberintel-ai-router
    ports:
      - "8003:8003"
    environment:
      - NODE_ENV=development
      - PORT=8003
      - REDIS_URL=redis://redis:6379
      # OLLAMA DISABLED IN LIGHTWEIGHT MODE:
      # - OLLAMA_URL=http://ollama:11434
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
      # OLLAMA DEPENDENCY REMOVED FOR LIGHTWEIGHT MODE
    volumes:
      - ./ai-router:/app
      - /app/node_modules
    command: npm run dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'        # Reduced from 1
          memory: 256M       # Reduced from 512M
    networks:
      - cyberintel-network

  # Graph Engine
  graph-engine:
    build:
      context: .              # Monorepo root
      dockerfile: graph-engine/Dockerfile
    container_name: cyberintel-graph-engine
    ports:
      - "8004:8004"
    environment:
      - NODE_ENV=development
      - PORT=8004
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=cyberintel
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./graph-engine:/app
      - /app/node_modules
    command: npm run dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'          # Reduced from 2
          memory: 512M       # Reduced from 1G
    networks:
      - cyberintel-network

  # Workers
  workers:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: cyberintel-workers
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://cyberintel:cyberintel@postgres:5432/cyberintel
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=cyberintel
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./workers:/app
    command: python worker.py
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'        # Reduced from 1
          memory: 512M       # Reduced from 1G
    networks:
      - cyberintel-network

  # Frontend
  frontend:
    build:
      context: .              # Monorepo root
      dockerfile: frontend/Dockerfile
    container_name: cyberintel-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'        # Reduced from 1
          memory: 256M       # Reduced from 512M
    networks:
      - cyberintel-network

  # Telegram Bot
  telegram-bot:
    build:
      context: .              # Monorepo root
      dockerfile: telegram-bot/Dockerfile
    container_name: cyberintel-telegram-bot
    ports:
      - "8006:8006"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - API_URL=http://gateway:8000
      - REDIS_URL=redis://redis:6379
      - HEALTH_PORT=8006
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
      gateway:
        condition: service_healthy
    volumes:
      - ./telegram-bot:/app
      - /app/node_modules
    command: npm run dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'       # Reduced from 0.5
          memory: 128M       # Reduced from 256M
    networks:
      - cyberintel-network

  # Ingestion Worker
  ingestion-worker:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: cyberintel-ingestion
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://cyberintel:cyberintel@postgres:5432/cyberintel
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./workers:/app
    command: python ingestion_worker.py
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'        # Reduced from 1
          memory: 256M       # Reduced from 512M
    networks:
      - cyberintel-network

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  elasticsearch_data:
  ollama_data:

networks:
  cyberintel-network:
    driver: bridge
