services:
  deathbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: deathbot:latest
    container_name: deathbot
    restart: unless-stopped

    # Secrets come from .env (copy .env.example → .env and fill it in).
    env_file:
      - .env

    # Pinned AFTER env_file so they always win: state must live on the volume.
    # A .env copied from .env.example carries host-style relative paths, which
    # would otherwise point at the read-only /app and crash on startup.
    environment:
      DATABASE_PATH: /data/deathbot.sqlite3
      SECRET_KEY_FILE: /data/.secret.key

    # SQLite database + AES master key. Losing this volume means losing every
    # stored API key, so keep it around.
    volumes:
      - deathbot-data:/data

    # Hardening: the app only ever writes to /data.
    read_only: true
    tmpfs:
      - /tmp
      - /home/deathbot/.config:uid=10001,gid=10001
      - /home/deathbot/.local:uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  deathbot-data:
